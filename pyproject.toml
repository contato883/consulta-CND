[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consulta-cnd"
version = "0.1.0"
description = "Consulta automatizada de CND (RFB/PGFN) via API oficial do SERPRO — uso interno da PERINAZZO CONTABILIDADE."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
consulta-cnd = "consulta_cnd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

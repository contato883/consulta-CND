[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consulta-cnd"
version = "0.1.0"
description = "Consulta de CND (RFB/PGFN) para os clientes da PERINAZZO CONTABILIDADE — via API oficial do SERPRO ou semi-automatizada pelo portal público, uso interno."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
navegador = ["playwright>=1.40"]

[project.scripts]
consulta-cnd = "consulta_cnd.cli:main"
consulta-cnd-navegador = "consulta_cnd.cli_navegador:main"
consulta-cnd-rotina = "consulta_cnd.cli_rotina:main"

[tool.setuptools.packages.find]
where = ["src"]
